<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Virtual internship illustration</title>
<desc id="desc">Students learning, coding and preparing for internship opportunities.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#315eea"/>
    <stop offset="1" stop-color="#7652c8"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e8f0ff"/>
    <stop offset="1" stop-color="#c9d8ff"/>
  </linearGradient>
</defs>
<rect width="1000" height="900" fill="url(#bg)"/>
<circle cx="790" cy="145" r="115" fill="#ffffff" opacity=".10"/>
<circle cx="150" cy="180" r="150" fill="#ffffff" opacity=".08"/>
<path d="M0 700 C220 610 330 770 520 665 C700 565 820 680 1000 570 V900 H0Z" fill="#17285f" opacity=".45"/>
<!-- desk -->
<rect x="100" y="690" width="800" height="28" rx="14" fill="#111d4b" opacity=".7"/>
<rect x="180" y="718" width="30" height="120" rx="12" fill="#111d4b" opacity=".65"/>
<rect x="790" y="718" width="30" height="120" rx="12" fill="#111d4b" opacity=".65"/>
<!-- laptop -->
<rect x="360" y="360" width="300" height="205" rx="15" fill="#0f1d4a"/>
<rect x="378" y="378" width="264" height="169" rx="8" fill="url(#screen)"/>
<path d="M315 575 H685 L735 620 H265 Z" fill="#d9e3ff"/>
<rect x="455" y="588" width="90" height="10" rx="5" fill="#8ba3e9"/>
<!-- code lines -->
<rect x="402" y="405" width="110" height="9" rx="4" fill="#315eea"/>
<rect x="402" y="430" width="175" height="9" rx="4" fill="#7652c8"/>
<rect x="402" y="455" width="135" height="9" rx="4" fill="#315eea"/>
<rect x="402" y="480" width="195" height="9" rx="4" fill="#8ba3e9"/>
<!-- person left -->
<circle cx="250" cy="410" r="55" fill="#f1b89d"/>
<path d="M195 405 C195 330 305 330 305 405 C275 370 225 370 195 405Z" fill="#30234e"/>
<path d="M175 665 C178 535 322 535 325 665Z" fill="#f4c44e"/>
<path d="M215 530 L160 620 L205 650 L250 570Z" fill="#f1b89d"/>
<path d="M285 530 L340 620 L300 650 L250 570Z" fill="#f1b89d"/>
<!-- person right -->
<circle cx="755" cy="405" r="55" fill="#d99a78"/>
<path d="M700 405 C700 330 810 330 810 405 C780 365 730 365 700 405Z" fill="#211b42"/>
<path d="M680 665 C683 535 827 535 830 665Z" fill="#55b9a6"/>
<path d="M720 530 L665 620 L710 650 L755 570Z" fill="#d99a78"/>
<path d="M790 530 L845 620 L800 650 L755 570Z" fill="#d99a78"/>
<!-- graduation/internship symbols -->
<path d="M120 300 L205 265 L290 300 L205 335 Z" fill="#ffffff" opacity=".92"/>
<path d="M155 320 V360 Q205 390 255 360 V320" fill="none" stroke="#ffffff" stroke-width="10" opacity=".9"/>
<circle cx="835" cy="280" r="45" fill="#ffffff" opacity=".15"/>
<path d="M815 280 l18 18 35-40" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>